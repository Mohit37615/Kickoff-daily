<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match | Kickoff Daily</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="match">
  <div id="site-header"></div>
  <main>
    <div class="match-head" id="match-head"></div>
    <p class="mh-comp" id="match-comp"></p>

    <div class="tabs">
      <button class="tab on" data-tab="lineups">Lineups</button>
      <button class="tab" data-tab="standings">Standings</button>
      <button class="tab" data-tab="details">Details</button>
    </div>
    <div class="tab-panel" id="tab-lineups"></div>
    <div class="tab-panel" id="tab-standings" hidden></div>
    <div class="tab-panel" id="tab-details" hidden></div>
  </main>
  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
